# =============================================================================
#  EDIT THESE FIVE LINES FIRST — everything else can stay as-is.
# =============================================================================
site_name: CoPHe
site_description: CoPHe (Computational Precision Health) — the graduate student
  association handbook and wiki for the joint UC Berkeley – UCSF PhD program.
# GitHub Pages for now. When the OCF subdomain is live, this becomes
# https://cph.studentorg.berkeley.edu/ — see "Moving to the real
# domain" in README.md for the two other things that change with it.
site_url: https://stan-hua.github.io/cph_gsa_website/
repo_url: https://github.com/stan-hua/cph_gsa_website
repo_name: stan-hua/cph_gsa_website
# =============================================================================

# Puts an "Edit this page" pencil on every page, linking straight to the
# GitHub web editor. This is how most people will make small fixes.
edit_uri: edit/main/docs/

# Rendered in the footer of every page. The second sentence is the disclaimer
# UC Berkeley requires of every registered student organization. Keep it on
# every page, verbatim.
copyright: >
  Maintained by CoPHe, the UC Berkeley &amp; UCSF CPH GSA.
  <span class="gsa-disclaimer">We are a student group acting independently of
  the University of California, Berkeley. We take full responsibility for our
  organization and this website.</span>

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  # CPH tile — same artwork as the favicon. extra.css hides it in the chrome
  # (the wordmark next to it already names the site), but it stays configured:
  # Material's logo anchor is the home link the wordmark borrows, and this
  # keeps the right artwork here if it's ever shown again.
  logo: assets/images/favicon.svg
  # Only for overrides/main.html, which adds the apple-touch-icon and the PNG
  # favicon fallbacks. Nothing else is overridden.
  custom_dir: overrides
  # Use the system font (what Notion does) instead of loading a web font.
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.sections     # top-level groups shown as headers in the sidebar
    - navigation.indexes      # section landing pages
    - navigation.top          # back-to-top button
    - toc.integrate           # page headings fold into the one left sidebar
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tooltips
    - content.code.copy
  palette:
    # Light: white header, black text. No brand colour anywhere.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark: black header, off-white text.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sidebar-toggle.js
  - assets/javascripts/header-home-link.js
  # Generated at build time by hooks/last_edited.py, then read by whats-new.js.
  - assets/javascripts/whats-new-data.js
  - assets/javascripts/whats-new.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stan-hua/cph_gsa_website
    - icon: fontawesome/solid/envelope
      link: mailto:gsa@example.berkeley.edu
  generator: false

# Renaming a heading silently breaks links that point at its anchor, so the
# build checks them. With `mkdocs build --strict` these become errors.
validation:
  anchors: warn
  unrecognized_links: warn

plugins:
  - search

# Reads the git history to put a "last update" date on every page, and to badge
# pages changed in the last 30 days. Needs full history, which is why the deploy
# workflow checks out with fetch-depth: 0.
hooks:
  - hooks/last_edited.py

# `mkdocs serve` watches docs/ and mkdocs.yml by default. Add the hook, so editing
# it reloads the server instead of silently serving the previous version.
watch:
  - hooks

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# -----------------------------------------------------------------------------
#  NAVIGATION  (this is the left sidebar)
#  Add a page by creating the .md file, then adding one line here.
#  Delete a line here and the page disappears from the menu.
# -----------------------------------------------------------------------------
nav:
  - Home: index.md

  - Start Here:
      - new-students/index.md
      - Before you arrive: new-students/before-you-arrive.md
      - Your first semester: new-students/first-semester.md
      - Finding housing: new-students/housing.md
      - Working across two campuses: new-students/two-campuses.md

  - Academics:
      - Curriculum and requirements: academics/curriculum.md
      - Qualifying exam: academics/quals.md
      - Choosing an advisor and lab: academics/advisors.md
      - Funding, fellowships and travel: academics/funding.md
      - Taxes: academics/taxes.md

  - Student Life:
      - Health and wellness: life/wellness.md
      - Getting support, and reporting harm: life/support-and-reporting.md
      - Social events and clubs: life/social.md
      - Living in the Bay Area: life/bay-area.md

  - The GSA:
      - About the GSA: about/index.md
      - Current officers: about/officers.md
      - Meetings and minutes: about/meetings.md
      - Bylaws: about/bylaws.md
      - Registration and signatories: about/registration-and-signatories.md
      - Funding events: about/funding-events.md
      - Events: events/index.md
      - Planning an event: events/planning-an-event.md
      - Calendar: events/calendar.md

  - Resources:
      - Forms and links: resources/forms-and-links.md
      - FAQ: resources/faq.md
      - Edit this site: resources/editing.md
